services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artlyrics
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d artlyrics"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://app:${DB_PASSWORD:-change-me}@db:5432/artlyrics
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # claude-proxy | anthropic | ollama (claude-cli direct is unavailable inside Docker).
      # Unset => anthropic if ANTHROPIC_API_KEY is set, else claude-proxy.
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-}
      CLAUDE_PROXY_URL: ${CLAUDE_PROXY_URL:-http://host.docker.internal:3099}
      CLAUDE_PROXY_TOKEN: ${CLAUDE_PROXY_TOKEN:-}
      CLAUDE_CLI_MODEL: ${CLAUDE_CLI_MODEL:-haiku}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:latest}
      SUNO_API_KEY: ${SUNO_API_KEY:-}
      SUNO_MODEL: ${SUNO_MODEL:-V4_5}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      UPLOAD_DIR: /data/uploads
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - uploads:/data/uploads
    # Lets the container reach the Claude CLI proxy / Ollama on the host (no-op on Docker Desktop, needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
